<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OreoBot — Documentation & Wiki</title>
  <meta name="description" content="Complete documentation for OreoBot — a feature-rich Discord bot built in Go by OreoStudios."/>
  <link rel="icon" type="image/png" href="/logo.png" sizes="256x256"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="OreoBot — Documentation & Wiki"/>
  <meta property="og:description" content="Complete documentation for OreoBot — commands, setup, config, and more."/>
  <meta property="og:image" content="https://oreostudio.store/img/oreobot.png"/>
  <meta property="og:image:width" content="256"/>
  <meta property="og:image:height" content="256"/>
  <meta property="og:url" content="https://oreostudio.store/wiki.html"/>
  <meta name="twitter:card" content="summary"/>
  <meta name="theme-color" content="#2d4ba8"/>

  <style>
    /* ========= OREO STUDIOS — BLUE STARFIELD THEME ========= */
    :root{
      --bg-0:#07092f;
      --bg-1:#0f1358;
      --fg:#f6f8ff;
      --muted:#b7c3e6;
      --card:#0b1033;
      --line:#ffffff14;
      --nav-h:56px;
      --sidebar-w:268px;
      --b1:#2260d8;
      --b2:#3695f6;
      --b3:#4fa6f2;
      --b4:#79a6f2;
      --grad: linear-gradient(135deg, var(--b1) 0%, var(--b2) 45%, var(--b3) 100%);
      --grad-soft: linear-gradient(135deg, #1537a6 0%, var(--b1) 40%, var(--b3) 100%);
      --wash:
        radial-gradient(900px 520px at 18% 12%, #3695f633, transparent 62%),
        radial-gradient(820px 520px at 82% 10%, #4fa6f22e, transparent 64%),
        radial-gradient(860px 640px at 50% 115%, #2260d833, transparent 64%),
        radial-gradient(560px 360px at 50% 40%, #ffffff10, transparent 70%);
      --shadow: 0 18px 60px #00000055, 0 10px 30px #00000040;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:
        radial-gradient(1200px 700px at 50% 15%, #151a63 0%, var(--bg-1) 22%, var(--bg-0) 62%, #04051b 100%),
        radial-gradient(900px 520px at 50% 55%, #0b0f3a 0%, transparent 70%);
      color:var(--fg);
      font:16px/1.6 Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    h1,h2,h3,h4{margin:0 0 .6rem;line-height:1.15}
    ul,ol{margin:0 0 .6rem 1.1rem}
    p{margin:0 0 .8rem}

    /* NEBULA */
    body::before{
      content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
      background:var(--wash);filter:saturate(1.12);
      animation:oreoFloat 18s ease-in-out infinite alternate;
    }
    @keyframes oreoFloat{from{transform:translateY(-8px)}to{transform:translateY(8px)}}

    #starfield{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;opacity:1;}

    @media(prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
      body::before{display:none}#starfield{display:none}
    }

    /* UTIL */
    .muted{color:var(--muted)}
    .gradient-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .reveal{opacity:0;transform:translateY(18px) scale(.985);filter:saturate(.95);transition:opacity .7s ease,transform .7s ease,filter .7s ease}
    .reveal.show{opacity:1;transform:none;filter:saturate(1)}

    /* NAV */
    .nav{
      position:fixed;top:0;left:0;right:0;z-index:1100;
      display:flex;align-items:center;justify-content:space-between;
      height:var(--nav-h);padding:14px 22px;
      background:rgba(6,8,26,.55);backdrop-filter:blur(12px);
      border-bottom:1px solid #ffffff14;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand-text{font-weight:900;letter-spacing:.2px}
    .brand-text .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .logo{width:32px;height:32px;object-fit:contain;border-radius:8px;filter:drop-shadow(0 0 10px #4fa6f255)}
    .nav-links{display:flex;gap:18px;align-items:center}
    .nav-links a{opacity:.85;transition:opacity .2s}
    .nav-links a:hover{opacity:1}
    .btn{
      display:inline-flex;align-items:center;gap:8px;padding:8px 14px;
      border-radius:12px;border:1px solid #ffffff1f;
      background:linear-gradient(180deg,#ffffff10,#00000010);
      transition:transform .18s,box-shadow .18s,border-color .18s;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00000044}
    .btn.primary{background:var(--grad);border-color:transparent;box-shadow:0 8px 28px #2260d833}
    #menu{display:none;background:none;border:0;color:var(--fg);font-size:22px;cursor:pointer}
    body.no-scroll{overflow:hidden}

    /* LAYOUT: SIDEBAR + CONTENT */
    .layout{display:flex;padding-top:var(--nav-h);min-height:100vh}

    /* SIDEBAR */
    .sidebar{
      position:fixed;
      top:var(--nav-h);left:0;bottom:0;
      width:var(--sidebar-w);
      overflow-y:auto;
      padding:24px 0 40px;
      border-right:1px solid #ffffff12;
      background:rgba(6,8,26,.7);
      backdrop-filter:blur(14px);
      z-index:900;
      scrollbar-width:thin;scrollbar-color:#2260d844 transparent;
    }
    .sidebar::-webkit-scrollbar{width:4px}
    .sidebar::-webkit-scrollbar-track{background:transparent}
    .sidebar::-webkit-scrollbar-thumb{background:#2260d866;border-radius:4px}

    .sidebar-section{margin-bottom:6px}
    .sidebar-label{
      font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
      color:var(--muted);padding:10px 20px 4px;opacity:.7;
    }
    .sidebar-link{
      display:flex;align-items:center;gap:9px;
      padding:8px 20px;font-size:14px;
      color:var(--fg);opacity:.72;
      transition:opacity .2s,background .2s,color .2s,padding-left .2s;
      border-left:2px solid transparent;
      cursor:pointer;
    }
    .sidebar-link:hover{opacity:1;background:rgba(79,166,242,.08);border-left-color:#3695f688;padding-left:24px}
    .sidebar-link.active{opacity:1;background:rgba(79,166,242,.12);border-left-color:#3695f6;color:#4fa6f2;font-weight:600}
    .sidebar-link .icon{font-size:15px;min-width:18px;text-align:center}

    /* MAIN CONTENT */
    .content{
      margin-left:var(--sidebar-w);
      flex:1;
      min-width:0;
      padding:40px 48px 80px;
      max-width:900px;
    }

    /* SECTIONS */
    .doc-section{
      padding:36px 0 28px;
      border-bottom:1px solid #ffffff0a;
      scroll-margin-top:calc(var(--nav-h) + 24px);
    }
    .doc-section:last-child{border-bottom:none}

    .doc-section h2{
      font-size:1.65rem;margin-bottom:20px;padding-bottom:12px;
      position:relative;
    }
    .doc-section h2::after{
      content:"";position:absolute;left:0;bottom:0;
      width:100%;height:1px;
      background:linear-gradient(90deg,#3695f666,transparent 60%);
    }
    .doc-section h3{
      font-size:1.1rem;margin:22px 0 10px;
      background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
      font-weight:700;
    }
    .doc-section h4{font-size:.95rem;margin:16px 0 8px;color:#79a6f2;font-weight:600}

    /* CARDS */
    .card{
      background:
        linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.14)),
        radial-gradient(120% 140% at 15% 10%,rgba(79,166,242,.14),transparent 55%),
        linear-gradient(180deg,#0b1033,#070a22);
      border:1px solid #ffffff14;padding:20px;border-radius:16px;
      transition:transform .25s,box-shadow .25s,border-color .25s;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:"";position:absolute;inset:-1px;border-radius:16px;padding:1px;
      background:conic-gradient(from 140deg,#4fa6f240,#2260d840,#79a6f230,#4fa6f240);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;opacity:.6;transition:opacity .25s;
    }
    .card:hover{transform:translateY(-4px);box-shadow:var(--shadow),0 8px 32px #2260d820;border-color:#4fa6f244}
    .card:hover::before{opacity:1}
